<!doctype html>
<html><head><meta charset="utf-8"><title>Components — Nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:22px 26px;}
</style></head>
<body><div class="wrap">
<style>
  .nav{background:var(--df-surface);border:1px solid var(--df-line);border-radius:10px;padding:8px;width:240px;}
  .grp{padding:8px 8px 4px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--df-ink-3);font-weight:500;}
  .item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--df-ink-2);cursor:pointer;}
  .item:hover{background:var(--df-surface-2);color:var(--df-ink);}
  .item.active{background:var(--df-clay-tint);color:#8D3E27;font-weight:500;}
  .item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .item .ct{margin-left:auto;font-size:11px;color:var(--df-ink-3);font-family:var(--df-font-mono);}
  .item.active .ct{color:#8D3E27;}
  .demo{display:flex;gap:24px;align-items:flex-start;}
  .right{flex:1;color:var(--df-ink-3);font-size:12px;line-height:1.6;padding-top:8px;font-family:var(--df-font-mono);}
  .right strong{color:var(--df-ink);font-weight:500;font-family:var(--df-font-sans);display:block;margin-bottom:4px;}
</style>
<div class="demo">
  <div class="nav">
    <div class="grp">Track</div>
    <div class="item active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard<span class="ct">⌘1</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M12 2v6m0 4v10m-9-9h6m4 0h6"/></svg>Weight<span class="ct">42</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Sleep<span class="ct">38</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/></svg>Spend</div>
    <div class="grp" style="margin-top:8px;">Decide</div>
    <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/></svg>Compare</div>
  </div>
  <div class="right">
    <strong>Sidebar nav</strong>
    240 px fixed width<br>
    8 px outer padding<br>
    6 px item radius<br>
    active = clay-tint bg<br>
    hover = surface-2 bg
  </div>
</div></div></body></html>
