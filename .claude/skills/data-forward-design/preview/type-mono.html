<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:22px 26px;}
</style></head>
<body><div class="wrap">
<style>
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;}
  .code{background:var(--df-surface-2);border:1px solid var(--df-line);border-radius:8px;padding:14px 16px;font-family:var(--df-font-mono);font-size:13px;line-height:1.6;color:var(--df-ink);}
  .code .k{color:var(--df-clay);}
  .code .v{color:#527A7A;}
  .code .c{color:var(--df-ink-3);}
  .meta{font-family:var(--df-font-mono);font-size:11px;color:var(--df-ink-3);}
  .meta strong{color:var(--df-ink);font-weight:500;font-family:var(--df-font-sans);}
  .row{display:flex;flex-direction:column;gap:6px;}
</style>
<div class="grid">
  <div class="code"><span class="c">// log entry</span><br>
  <span class="k">weight</span>: <span class="v">168.4</span>,<br>
  <span class="k">unit</span>: <span class="v">"lb"</span>,<br>
  <span class="k">at</span>: <span class="v">"2026-05-21T07:14"</span></div>
  <div class="row">
    <div class="meta"><strong>Geist Mono</strong> · 400 · 500</div>
    <div class="meta">code, keys, timestamps</div>
    <div class="meta">tnum + ss01 features</div>
    <div class="meta">sits on surface-2 well</div>
  </div>
</div></div></body></html>
