<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Numbers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:22px 26px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .card{background:var(--df-surface);border:1px solid var(--df-line);border-radius:10px;padding:16px 18px;}
  .lbl{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--df-ink-3);font-weight:500;}
  .big{
    margin-top:8px;
    font-family: var(--df-font-sans);
    font-weight: 300;
    font-size: 48px;
    line-height: 1;
    letter-spacing: -0.015em;
    color: var(--df-ink);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .big .u{
    font-size: 14px;
    font-weight: 500;
    color: var(--df-ink-3);
    letter-spacing: 0;
  }
  .delta{margin-top:8px;font-size:12px;color:var(--df-ink-3);font-family:var(--df-font-sans);}
  .delta .up{color:#6B8E5A;font-weight:500;}
  .delta .down{color:#B14F40;font-weight:500;}
</style></head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="card">
      <div class="lbl">Sleep, 7-day avg</div>
      <div class="big">6h 48m</div>
      <div class="delta"><span class="up">↑ 22 m</span> from last week</div>
    </div>
    <div class="card">
      <div class="lbl">Weight</div>
      <div class="big">168.4<span class="u">lb</span></div>
      <div class="delta"><span class="down">↓ 1.4 lb</span> in 14 days</div>
    </div>
    <div class="card">
      <div class="lbl">Spend, mtd</div>
      <div class="big">$1,284</div>
      <div class="delta">68 % of monthly budget</div>
    </div>
  </div>
</div>
</body></html>
