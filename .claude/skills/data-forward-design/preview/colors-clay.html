<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Clay accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:20px 24px;}
</style></head>
<body><div class="wrap">
<style>
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .sw{border-radius:10px;overflow:hidden;border:1px solid var(--df-line);background:var(--df-surface);}
  .chip{height:90px;}
  .meta{padding:8px 10px;font-size:11px;line-height:1.35;}
  .name{font-weight:500;color:var(--df-ink);}
  .hex{color:var(--df-ink-3);font-family:var(--df-font-mono);}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F3DDCE"></div><div class="meta"><div class="name">clay-tint</div><div class="hex">#F3DDCE</div></div></div>
  <div class="sw"><div class="chip" style="background:#E8C9B8"></div><div class="meta"><div class="name">clay-soft</div><div class="hex">#E8C9B8</div></div></div>
  <div class="sw"><div class="chip" style="background:#B8593A"></div><div class="meta"><div class="name">clay</div><div class="hex">#B8593A</div></div></div>
  <div class="sw"><div class="chip" style="background:#A24B30"></div><div class="meta"><div class="name">clay-hover</div><div class="hex">#A24B30</div></div></div>
  <div class="sw"><div class="chip" style="background:#8D3E27"></div><div class="meta"><div class="name">clay-press</div><div class="hex">#8D3E27</div></div></div>
</div></div></body></html>
