<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:20px 24px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .sw{border-radius:10px;overflow:hidden;border:1px solid var(--df-line);background:var(--df-surface);}
  .chip{height:78px;}
  .meta{padding:8px 10px;font-size:11px;line-height:1.35;}
  .name{font-weight:500;color:var(--df-ink);}
  .hex{color:var(--df-ink-3);font-family:var(--df-font-mono);letter-spacing:-0.01em;}
</style></head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#F5F1EA"></div><div class="meta"><div class="name">canvas</div><div class="hex">#F5F1EA</div></div></div>
    <div class="sw"><div class="chip" style="background:#FBF8F2"></div><div class="meta"><div class="name">surface</div><div class="hex">#FBF8F2</div></div></div>
    <div class="sw"><div class="chip" style="background:#EFE8DB"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#EFE8DB</div></div></div>
    <div class="sw"><div class="chip" style="background:#E5DDD0"></div><div class="meta"><div class="name">line</div><div class="hex">#E5DDD0</div></div></div>
    <div class="sw"><div class="chip" style="background:#D2C7B5"></div><div class="meta"><div class="name">line-strong</div><div class="hex">#D2C7B5</div></div></div>
  </div>
</div>
</body></html>
