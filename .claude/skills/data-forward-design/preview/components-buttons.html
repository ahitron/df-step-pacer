<!doctype html>
<html><head><meta charset="utf-8"><title>Components — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:22px 26px;}
</style></head>
<body><div class="wrap">
<style>
  .lbl{font-family:var(--df-font-mono);font-size:10px;color:var(--df-ink-3);margin-bottom:8px;text-transform:lowercase;letter-spacing:0.04em;}
  .group{display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--df-line);background:var(--df-surface);font-size:14px;color:var(--df-ink);font-family:var(--df-font-sans);font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;}
  .btn.primary{background:var(--df-clay);color:var(--df-ink-inverse);border-color:var(--df-clay);}
  .btn.primary:hover{background:var(--df-clay-hover);border-color:var(--df-clay-hover);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--df-ink-2);}
  .btn.danger{background:#B14F40;color:#FBF8F2;border-color:#B14F40;}
  .btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:5px;}
  .btn.lg{height:44px;padding:0 22px;font-size:15px;border-radius:8px;}
  .btn:disabled,.btn.disabled{opacity:0.5;cursor:not-allowed;}
  .btn.icon{width:36px;padding:0;justify-content:center;}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
</style>
<div class="group">
  <div>
    <div class="lbl">primary · secondary · ghost · danger</div>
    <div class="row">
      <button class="btn primary">Add entry</button>
      <button class="btn">Cancel</button>
      <button class="btn ghost">Skip</button>
      <button class="btn danger">Delete log</button>
      <button class="btn disabled" disabled>Saving…</button>
    </div>
  </div>
  <div>
    <div class="lbl">sizes · with icon · icon only</div>
    <div class="row">
      <button class="btn sm">Small</button>
      <button class="btn">Default</button>
      <button class="btn lg">Large</button>
      <button class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add weight</button>
      <button class="btn icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    </div>
  </div>
</div></div></body></html>
