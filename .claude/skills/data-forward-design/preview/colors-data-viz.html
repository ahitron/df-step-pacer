<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Data viz</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:20px 24px;}
</style></head>
<body><div class="wrap">
<style>
  .row{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;}
  .sw{border-radius:8px;overflow:hidden;border:1px solid var(--df-line);background:var(--df-surface);}
  .chip{height:64px;}
  .meta{padding:6px 8px;font-size:10px;line-height:1.3;}
  .name{font-weight:500;}
  .hex{color:var(--df-ink-3);font-family:var(--df-font-mono);font-size:9px;}
  .demo{margin-top:18px;height:60px;display:flex;align-items:flex-end;gap:6px;padding:0 4px;}
  .demo .b{flex:1;border-radius:4px 4px 0 0;}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#B8593A"></div><div class="meta"><div class="name">data-1</div><div class="hex">clay</div></div></div>
  <div class="sw"><div class="chip" style="background:#C49A3B"></div><div class="meta"><div class="name">data-2</div><div class="hex">ochre</div></div></div>
  <div class="sw"><div class="chip" style="background:#6B8E5A"></div><div class="meta"><div class="name">data-3</div><div class="hex">sage</div></div></div>
  <div class="sw"><div class="chip" style="background:#527A7A"></div><div class="meta"><div class="name">data-4</div><div class="hex">teal</div></div></div>
  <div class="sw"><div class="chip" style="background:#8E6B83"></div><div class="meta"><div class="name">data-5</div><div class="hex">mauve</div></div></div>
  <div class="sw"><div class="chip" style="background:#9B8B7A"></div><div class="meta"><div class="name">data-6</div><div class="hex">stone</div></div></div>
  <div class="sw"><div class="chip" style="background:#3F4A52"></div><div class="meta"><div class="name">data-7</div><div class="hex">slate</div></div></div>
  <div class="sw"><div class="chip" style="background:#D9A77C"></div><div class="meta"><div class="name">data-8</div><div class="hex">tan</div></div></div>
</div>
<div class="demo">
  <div class="b" style="background:#B8593A;height:60%"></div>
  <div class="b" style="background:#C49A3B;height:85%"></div>
  <div class="b" style="background:#6B8E5A;height:45%"></div>
  <div class="b" style="background:#527A7A;height:72%"></div>
  <div class="b" style="background:#8E6B83;height:38%"></div>
  <div class="b" style="background:#9B8B7A;height:55%"></div>
  <div class="b" style="background:#3F4A52;height:28%"></div>
  <div class="b" style="background:#D9A77C;height:65%"></div>
</div></div></body></html>
