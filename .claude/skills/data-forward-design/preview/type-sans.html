<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Geist sans</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:22px 26px;}
</style></head>
<body><div class="wrap">
<style>
  .specimen{font-family:var(--df-font-sans);color:var(--df-ink);line-height:1.4;font-size:17px;max-width:600px;}
  .top{font-size:32px;font-weight:500;letter-spacing:-0.02em;line-height:1.1;margin-bottom:8px;}
  .meta{display:flex;gap:24px;margin-top:14px;color:var(--df-ink-3);font-size:11px;font-family:var(--df-font-mono);}
  .meta strong{color:var(--df-ink);font-weight:500;font-family:var(--df-font-sans);}
</style>
<div class="top">You've slept 6 h 48 m on average this week.</div>
<div class="specimen">A neutral, screen-friendly sans for body, labels, and UI chrome. Sets quietly at small sizes and stays readable at 11 px.</div>
<div class="meta">
  <span><strong>Geist</strong> · 400 · 500 · 600</span>
  <span>body 15 / 1.5</span>
  <span>UI 11–24 px</span>
</div></div></body></html>
