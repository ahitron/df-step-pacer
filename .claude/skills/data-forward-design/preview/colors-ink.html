<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Ink</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:20px 24px;}
</style></head>
<body><div class="wrap">
<style>
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
  .sw{border-radius:10px;overflow:hidden;border:1px solid var(--df-line);background:var(--df-surface);}
  .chip{height:78px;display:flex;align-items:center;justify-content:center;font-family:var(--df-font-sans);font-weight:300;font-size:36px;letter-spacing:-0.02em;}
  .meta{padding:8px 10px;font-size:11px;line-height:1.35;}
  .name{font-weight:500;color:var(--df-ink);}
  .hex{color:var(--df-ink-3);font-family:var(--df-font-mono);letter-spacing:-0.01em;}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#2A2620;color:#FBF8F2">Aa</div><div class="meta"><div class="name">ink</div><div class="hex">#2A2620</div></div></div>
  <div class="sw"><div class="chip" style="background:#5C544A;color:#FBF8F2">Aa</div><div class="meta"><div class="name">ink-2</div><div class="hex">#5C544A</div></div></div>
  <div class="sw"><div class="chip" style="background:#8F857A;color:#FBF8F2">Aa</div><div class="meta"><div class="name">ink-3</div><div class="hex">#8F857A</div></div></div>
  <div class="sw"><div class="chip" style="background:#B8AE9F;color:#2A2620">Aa</div><div class="meta"><div class="name">ink-4</div><div class="hex">#B8AE9F</div></div></div>
  <div class="sw"><div class="chip" style="background:#FBF8F2;color:#2A2620;border:1px solid #E5DDD0">Aa</div><div class="meta"><div class="name">ink-inverse</div><div class="hex">#FBF8F2</div></div></div>
</div></div></body></html>
