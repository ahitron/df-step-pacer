<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--df-canvas);font-family:var(--df-font-sans);color:var(--df-ink);}
  .wrap{padding:22px 26px;}
</style></head>
<body><div class="wrap">
<style>
  .row{display:flex;flex-direction:column;gap:8px;}
  .item{display:flex;align-items:center;gap:14px;font-family:var(--df-font-mono);font-size:11px;color:var(--df-ink-3);}
  .item .name{flex:0 0 60px;color:var(--df-ink);font-weight:500;font-family:var(--df-font-sans);}
  .item .px{flex:0 0 48px;}
  .item .bar{height:14px;background:var(--df-clay-soft);border-left:2px solid var(--df-clay);border-right:2px solid var(--df-clay);}
</style>
<div class="row">
  <div class="item"><span class="name">space-1</span><span class="px">4 px</span><span class="bar" style="width:4px"></span></div>
  <div class="item"><span class="name">space-2</span><span class="px">8 px</span><span class="bar" style="width:8px"></span></div>
  <div class="item"><span class="name">space-3</span><span class="px">12 px</span><span class="bar" style="width:12px"></span></div>
  <div class="item"><span class="name">space-4</span><span class="px">16 px</span><span class="bar" style="width:16px"></span></div>
  <div class="item"><span class="name">space-5</span><span class="px">20 px</span><span class="bar" style="width:20px"></span></div>
  <div class="item"><span class="name">space-6</span><span class="px">24 px</span><span class="bar" style="width:24px"></span></div>
  <div class="item"><span class="name">space-8</span><span class="px">32 px</span><span class="bar" style="width:32px"></span></div>
  <div class="item"><span class="name">space-10</span><span class="px">40 px</span><span class="bar" style="width:40px"></span></div>
  <div class="item"><span class="name">space-12</span><span class="px">48 px</span><span class="bar" style="width:48px"></span></div>
  <div class="item"><span class="name">space-16</span><span class="px">64 px</span><span class="bar" style="width:64px"></span></div>
  <div class="item"><span class="name">space-20</span><span class="px">80 px</span><span class="bar" style="width:80px"></span></div>
</div></div></body></html>
